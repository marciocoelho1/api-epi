spring.application.name=api_epi

# Banco: na nuvem usa as variaveis de ambiente; no PC usa o MySQL local
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/epi_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USER:root}
# Obs.: o bloco do professor assume senha "root"; neste PC o root do MariaDB
# esta sem senha, por isso o padrao vazio. Na nuvem basta definir DB_PASSWORD.
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:true}
# Pool pequeno: banco gratuito aceita poucas conexoes
spring.datasource.hikari.maximum-pool-size=5
# O Render informa a porta pela variavel PORT
server.port=${PORT:8080}
